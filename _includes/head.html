<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign description = page.dem | default: page.description | default: site.description %}
  <meta name="description" content="{{ description | escape }}">
  <title>{% if page.title == 'Home' %}{{ site.title | escape }}{% else %}{{ page.title | escape }} &middot; {{ site.title | escape }}{% endif %}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="{{ '/public/css/app.css' | relative_url }}">
  <link rel="icon" href="{{ '/public/favicon.ico' | relative_url }}">
  {% if page.url == '/' %}
  <script defer src="{{ '/public/vendor/list.min.js' | relative_url }}"></script>
  {% elsif page.layout == 'post' %}
  <script defer src="{{ '/public/vendor/tocbot.min.js' | relative_url }}"></script>
  <script defer src="{{ '/public/vendor/anchor.min.js' | relative_url }}"></script>
  {% endif %}
  <script defer src="{{ '/public/js/script.js' | relative_url }}"></script>
</head>
