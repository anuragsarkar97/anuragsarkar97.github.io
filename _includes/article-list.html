<p class="results" id="note-count">Results: {{ site.posts.size }}</p>
<div class="note-table-wrap">
  <table class="note-table">
    <thead>
      <tr>
        <th scope="col">Title</th>
        <th scope="col">State</th>
        <th scope="col">Updated</th>
      </tr>
    </thead>
    <tbody>
      {% for post in site.posts %}
      <tr data-title="{{ post.title | downcase | escape }}">
        <td><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></td>
        <td><span class="state state-{{ post.state | default: 'published' | downcase | escape }}">{{ post.state | default: "published" | escape }}</span></td>
        <td><time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%b %-d, %Y" }}</time></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
