<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" fill="none">
  <rect width="1200" height="520" fill="#e3eee4"/>
  <text x="72" y="84" fill="#1a261c" font-family="system-ui, sans-serif" font-size="28" font-weight="650">Same key, two owners</text>
  <text x="72" y="188" fill="#1a261c" font-family="system-ui, sans-serif" font-size="22">Attempt 1</text>
  <rect x="250" y="156" width="560" height="52" rx="26" fill="#1d5a36"/>
  <text x="276" y="188" fill="#fff" font-family="system-ui, sans-serif" font-size="20">write in flight</text>
  <text x="72" y="292" fill="#1a261c" font-family="system-ui, sans-serif" font-size="22">Attempt 2</text>
  <rect x="520" y="260" width="560" height="52" rx="26" fill="#1a261c"/>
  <text x="546" y="292" fill="#fff" font-family="system-ui, sans-serif" font-size="20">retry, new timeout</text>
  <rect x="520" y="156" width="290" height="156" rx="18" fill="#1d5a36" opacity=".18"/>
  <text x="72" y="420" fill="#1a261c" font-family="system-ui, sans-serif" font-size="22">The shaded span is when both attempts believe they own the key.</text>
</svg>
