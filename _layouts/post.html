---
layout: default
---
<article>
  <header class="post-header">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">&larr; All writing</a>
    <h1>{{ page.title | escape }}</h1>
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  {% assign body = content %}
  {% if body contains '<h1' %}
    {% assign body = body | replace: '<h3', '<h4' | replace: '</h3>', '</h4>' | replace: '<h2', '<h3' | replace: '</h2>', '</h3>' | replace: '<h1', '<h2' | replace: '</h1>', '</h2>' %}
  {% endif %}
  <div class="prose">{{ body | replace: '<iframe ', '<iframe loading="lazy" title="Embedded animation" ' | replace: '<img ', '<img loading="lazy" decoding="async" ' }}</div>
</article>
{% if page.previous or page.next %}
<nav class="next-reading" aria-label="More writing">
  <h2>Keep reading</h2>
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">{{ page.previous.title | escape }}</a>{% endif %}
  {% if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title | escape }}</a>{% endif %}
</nav>
{% endif %}
